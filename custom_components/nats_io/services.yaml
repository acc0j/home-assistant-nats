publish:
  fields:
    subject:
      required: true
      example: voice.queue
      selector:
        text:
    payload:
      required: true
      example: '{"message": "Front door left open"}'
      selector:
        object:
    headers:
      example: '{"Nats-Msg-Id": "front-door-1"}'
      selector:
        object:
    jetstream:
      default: false
      selector:
        boolean:
    config_entry_id:
      selector:
        config_entry:
          integration: nats_io

fetch:
  fields:
    stream:
      required: true
      example: VOICE
      selector:
        text:
    consumer:
      required: true
      example: digest
      selector:
        text:
    batch:
      default: 10
      selector:
        number:
          min: 1
          max: 100
          mode: box
    timeout:
      default: 2
      selector:
        number:
          min: 0.1
          max: 30
          step: 0.1
          unit_of_measurement: s
          mode: box
    ack:
      default: true
      selector:
        boolean:
    config_entry_id:
      selector:
        config_entry:
          integration: nats_io
